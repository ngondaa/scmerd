[program:scmerd-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/scmerd/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/scmerd/storage/logs/queue-worker.log
stopwaitsecs=3600
